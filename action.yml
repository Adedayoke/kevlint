name: kevlint
description: Check a QNX kernel trace for priority inversions and write an HTML report.

inputs:
  trace:
    description: Path to traceprinter text output, captured with tracelogger -w.
    required: true
  report:
    description: Where to write the HTML report.
    required: false
    default: kevlint-report.html
  config:
    description: Optional kevlint.toml rules file. Without it, only priority-inversion runs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # kevlint is tested on 3.12 and --config needs 3.11 or newer. The job's own python3
    # is left alone: update-environment keeps this Python off the caller's PATH.
    - name: Set up Python for kevlint
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        update-environment: false

    - name: Run kevlint
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/host
        KEVLINT_PYTHON: ${{ steps.python.outputs.python-path }}
        KEVLINT_TRACE: ${{ inputs.trace }}
        KEVLINT_REPORT: ${{ inputs.report }}
        KEVLINT_CONFIG: ${{ inputs.config }}
      run: |
        mkdir -p "$(dirname "$KEVLINT_REPORT")"
        config_args=()
        if [ -n "$KEVLINT_CONFIG" ]; then config_args=(--config "$KEVLINT_CONFIG"); fi
        "$KEVLINT_PYTHON" --version
        "$KEVLINT_PYTHON" -m kevlint check "$KEVLINT_TRACE" \
          --html "$KEVLINT_REPORT" \
          --summary "$GITHUB_STEP_SUMMARY" \
          "${config_args[@]}"
